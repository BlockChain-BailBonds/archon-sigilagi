[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neural-auto-patch"
version = "0.1.0"
description = "Policy-bounded autonomous vulnerability containment"
requires-python = ">=3.11"
dependencies = ["requests>=2.31", "jsonschema>=4.20", "cryptography>=41"]

[project.scripts]
nap = "nap.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
