name: Archon SigilAGI global sentinel refresh
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install sentinel
        run: python -m pip install .
      - name: Refresh global threat intelligence
        run: python -m nap.cli global-scan --db /tmp/archon-sigilagi.db --output web/data/alerts.json
      - name: Publish refreshed intelligence
        run: |
          git config user.name 'Archon SigilAGI Sentinel'
          git config user.email 'actions@users.noreply.github.com'
          git add web/data/alerts.json
          git diff --cached --quiet || git commit -m 'Refresh global threat intelligence'
          git push
